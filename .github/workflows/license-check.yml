#
# Checks all files for missing license and copyright information with REUSE.

name: License Check

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  license-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install REUSE
        run: |
          python -m pip install --upgrade pip
          pip install reuse

      - name: Check licenses
        run: reuse lint
