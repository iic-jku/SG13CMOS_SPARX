version = 1

# Files that cannot carry an SPDX header (data, figures, generated results)
# are annotated here. Source files (Python scripts, Makefiles, workflows)
# carry their own SPDX headers, so the license check still catches new
# source files without licensing information.

[[annotations]]
path = [".gitattributes", ".gitignore", "CITATION.cff", "KNOWN_ISSUES.md", "README.md", "ToDo.md"]
SPDX-FileCopyrightText = "2025-2026 The SPARX Team"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

[[annotations]]
path = ".claude/**"
SPDX-FileCopyrightText = "2025-2026 The SPARX Team"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

